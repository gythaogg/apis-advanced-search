{% extends "base.html" %}
{% load static %}

{% block title %}Advanced Search{% endblock %}

{% block styles %}
  {{ block.super }}
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" />
  <link rel="stylesheet" href="{% static 'apis_advanced_search/css/querybuilder.css' %}" />
{% endblock %}

{% block content %}
  <div class="container-fluid"
       id="qb-app"
       data-csrf-token="{{ csrf_token }}"
       data-models-url="{% url 'apis_advanced_search:api-models' %}"
       data-fields-url-template="{% url 'apis_advanced_search:api-model-fields' app_label='__app__' model_name='__model__' %}"
       data-relations-url-template="{% url 'apis_advanced_search:api-model-relations' app_label='__app__' model_name='__model__' %}"
       data-query-url-template="{% url 'apis_advanced_search:api-model-query' app_label='__app__' model_name='__model__' %}"
       data-add-to-collection-url-template="{% url 'apis_advanced_search:api-model-add-to-collection' app_label='__app__' model_name='__model__' %}"
       data-collections-url="{% url 'apis_advanced_search:api-collections' %}"
       data-saved-queries-url="{% url 'apis_advanced_search:api-saved-queries' %}"
       data-is-authenticated="{{ request.user.is_authenticated|yesno:'true,false' }}"
       data-collections-enabled="{{ collections_enabled|yesno:'true,false' }}">

    <div class="row mt-3">
      <div class="col-12 col-xl-9 mx-auto">
        <div class="mb-3 d-flex align-items-end gap-3 flex-wrap">
          <div>
            <label for="qb-model-select" class="form-label">Search for</label>
            <select id="qb-model-select" class="form-select w-auto"></select>
          </div>
          <div>
            <select id="qb-load-saved-select" class="form-select w-auto"></select>
          </div>
          <div id="qb-save-query-controls"></div>
        </div>

        <div id="qb-builder-root"></div>

        <div class="mt-3 mb-4 d-flex justify-content-center">
          <button id="qb-search-btn" type="button" class="btn btn-primary btn-lg px-5">Search</button>
        </div>

        <div id="qb-results"></div>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ block.super }}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
  <script src="{% static 'apis_advanced_search/js/querybuilder.js' %}"></script>
{% endblock %}
