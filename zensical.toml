[project]
site_name = "APIS Advanced Search"
site_description = "Query builder for APIS instances"
site_url = "https://gythaogg.github.io/apis-advanced-search/"
repo_url = "https://github.com/gythaogg/apis-advanced-search"
repo_name = "gythaogg/apis-advanced-search"
edit_uri = "edit/main/docs/"
copyright = "MIT licence"

nav = [
  { "Introduction" = "index.md" },
  { "Search" = [
    { "Simple search" = "search/simple-search.md" },
    { "Relation search" = "search/relation-search.md" },
    { "Groups" = "search/groups.md" },
    { "Columns" = "search/columns.md" },
  ]},
  { "Beta features" = [
    { "Saved queries" = "beta/saved-queries.md" },
    { "Save results" = "beta/save-results.md" },
    { "Inspect query" = "beta/inspect-query.md" },
  ]},
  { "Developers" = [
    { "Installation" = "developers/installation.md" },
    { "Settings" = "developers/settings.md" },
  ]},
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
"zensical.extensions.glightbox" = { auto_caption = true }
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
